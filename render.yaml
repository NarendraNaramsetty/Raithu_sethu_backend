services:
  - type: web
    name: raithusetu-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn raithu_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_HOSTS
        sync: false          # set to your-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # set to https://your-frontend.vercel.app
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: Anthropic_Claude_API_Key
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
